[package]
name = "countyroot-verify"
version = "0.1.0"
description = "Verify CountyRoot parcel proofs (leaf v2) against on-chain CountyRoot roots inside any Solana program, without CPI"
license = "PolyForm-Shield-1.0.0"
homepage = "https://countyroot.com"
repository = "https://github.com/JG21OX/countyroot"
documentation = "https://docs.rs/countyroot-verify"
readme = "README.md"
keywords = ["solana", "merkle", "proof", "parcel", "countyroot"]
categories = ["cryptography", "no-std"]
edition = "2021"
rust-version = "1.89.0"
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = []
# Select the cluster. Exactly one must be enabled; building with neither is a compile error.
devnet = []
mainnet = []

[dependencies]
solana-account-info = "3"
solana-pubkey = { version = "3", default-features = false, features = ["curve25519", "sha2"] }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
base64 = "0.22"
proptest = "1"

[package.metadata.docs.rs]
features = ["devnet"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Standalone: not a member of the program workspace, so `cargo build` there is unaffected by the
# required cluster feature.
[workspace]
