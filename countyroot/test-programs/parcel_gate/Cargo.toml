# Example consumer of countyroot-verify: a program that only accepts parcels proven against
# CountyRoot's latest active root, and records a receipt. Test-only, LiteSVM; never deployed.
[package]
name = "parcel_gate"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Shield-1.0.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
countyroot-verify = { path = "../../crates/countyroot-verify", features = ["devnet"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
serde_json = "1"
hex = "0.4"
base64 = "0.22"
bincode = "1"
solana-pubkey = "3"
solana-instruction = "3"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }

[workspace]
